services:
  - type: web
    runtime: node
    name: dice-game-api-igorm1930
    plan: free
    region: frankfurt
    rootDir: api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://dice-game-web-igorm1930.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: JWT_ISSUER
        value: dice-game-api
      - key: JWT_AUDIENCE
        value: dice-game-web

  - type: web
    runtime: static
    name: dice-game-web-igorm1930
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: VITE_API_URL
        value: https://dice-game-api-igorm1930.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
